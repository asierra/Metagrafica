# Binarios de release: Linux, macOS y WINDOWS (.exe).
#
# Por qué existe: hasta ahora probar MetaGráfica exigía clonar y compilar, y ese
# es el filtro que se lleva por delante a la mayoría de quien llega de la galería.
# Windows es el caso extremo —no hay compilador de sistema— así que ahí lo que se
# reparte tiene que ser un .exe ya hecho.
#
# Cómo se dispara:  git tag v3.1.0-beta && git push origin v3.1.0-beta
# (o a mano desde la pestaña Actions, con workflow_dispatch).
#
# El .exe se CRUZA desde Linux con MinGW-w64, que es como se armó también la
# versión de 1999. No hace falta una máquina Windows en el proceso.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: linux-x86_64
            os: ubuntu-latest
            cross: ""
            binario: mg
          - nombre: windows-x86_64
            os: ubuntu-latest
            cross: x86_64-w64-mingw32
            binario: mg.exe
          - nombre: macos-arm64
            os: macos-latest
            cross: ""
            binario: mg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex zlib1g-dev
          if [ -n "${{ matrix.cross }}" ]; then
            sudo apt-get install -y mingw-w64 libz-mingw-w64-dev
          fi

      - name: Compilar (nativo)
        if: matrix.cross == ''
        run: make CXX=${{ matrix.os == 'ubuntu-latest' && 'g++' || 'clang++' }}

      - name: Compilar (cruzado a Windows)
        if: matrix.cross != ''
        run: make CROSS=${{ matrix.cross }}

      # La red de pruebas solo corre donde el binario se puede EJECUTAR. En el
      # build cruzado no hay nada que ejecutar, así que ahí basta con que enlace:
      # el .exe se verifica en el trabajo `smoke-windows` de abajo.
      #
      # `capture` corre CINCO de las seis compuertas (todas menos el golden por
      # bytes, que necesita una red que no está en git) y sale con código ≠ 0 si
      # alguna falla. **Bloquea en las dos plataformas nativas.** En macOS estuvo
      # un rato como informativo, por si una diferencia de último dígito en libm
      # movía los renders publicados; se cambió el 2026-07-27 al caer en cuenta de
      # que **nadie del proyecto tiene ya un Mac**: si esto no bloquea, macOS deja
      # de tener cualquier vigilancia. Y el miedo que lo justificaba lo despeja el
      # trabajo `smoke-macos`, que compara byte a byte contra Linux.
      - name: Pruebas (nativo, bloquea)
        if: matrix.cross == ''
        run: bash test/run.sh capture

      - name: Armar el paquete
        run: |
          set -e
          dir=metagrafica-${{ matrix.nombre }}
          mkdir -p "$dir"
          cp bin/${{ matrix.binario }} "$dir/"
          # lib/ va JUNTO al binario: en Windows es la única biblioteca que hay
          # (el binario la busca al lado del .exe), y en Unix sirve para probar
          # sin `make install`.
          cp -r lib "$dir/"
          mkdir -p "$dir/examples"
          cp examples/*.mg "$dir/examples/"
          cp README.md README.es.md LICENSE docs/referencia.md "$dir/" 2>/dev/null || true
          if [ "${{ matrix.binario }}" = "mg.exe" ]; then
            zip -r "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      # Salidas de referencia para la comparación entre plataformas de abajo.
      #
      # Antes del 2026-08-04 esto exigía escribir con una ruta RELATIVA idéntica a
      # la de Windows, porque el EPS llevaba la ruta de salida dentro, en %%Title:
      # dos rutas distintas daban archivos distintos por una razón que no importa.
      # Ya no: %%Title lleva el nombre del .mg de origen y la salida no depende de
      # dónde se escriba. Se conserva la ruta simétrica por claridad, no por
      # necesidad — si algún día vuelve a hacer falta, es que se rompió algo.
      - name: Salidas de referencia (Linux)
        if: matrix.nombre == 'linux-x86_64'
        run: |
          mkdir -p salidas
          cd examples
          for f in *.mg; do
            n="${f%.mg}"
            for fmt in eps svg pdf; do ../bin/mg "$f" "../salidas/$n.$fmt" >/dev/null; done
          done

      - uses: actions/upload-artifact@v7
        if: matrix.nombre == 'linux-x86_64'
        with:
          name: salidas-linux
          path: salidas

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nombre }}
          path: |
            metagrafica-*.tar.gz
            metagrafica-*.zip

  # El .exe cruzado no se ejecutó en el trabajo que lo produjo. Aquí se corre DE
  # VERDAD sobre Windows y se le exige compilar una figura que ejercita el
  # camino más frágil de la plataforma: `include` de la biblioteca que viaja al
  # lado del .exe. Sin esto estaríamos publicando un binario que nadie ejecutó.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: salidas-linux
          path: salidas-linux
      - name: Desempacar y dibujar
        shell: bash
        run: |
          set -e
          unzip -q metagrafica-windows-x86_64.zip
          cd metagrafica-windows-x86_64
          ./mg.exe examples/orbita_polar.mg salida.svg
          ./mg.exe examples/orbita_polar.mg salida.pdf
          ./mg.exe examples/franck_condon.mg salida.eps
          for f in salida.svg salida.pdf salida.eps; do
            test -s "$f" || { echo "vacío: $f"; exit 1; }
          done
          # El PDF es binario: si Windows hubiera traducido saltos de línea, la
          # cabecera dejaría de ser %PDF y el archivo estaría corrupto.
          head -c 5 salida.pdf | grep -q '%PDF' || { echo "PDF corrupto"; exit 1; }
          # `include` SIN ruta: el único camino que es código exclusivo de Windows
          # (parserv3.cpp, exeDir) y que no se puede probar en otra plataforma.
          # Debe encontrar lib\satellite.mg junto al .exe.
          printf 'display_size 4 4\nworld_window 0 4 0 4\ninclude "satellite.mg"\nSatellite(at=(2,2), scale=1)\n' > biblioteca.mg
          ./mg.exe biblioteca.mg biblioteca.svg
          test -s biblioteca.svg || { echo "el include junto al .exe no resolvió"; exit 1; }
          echo "ok: mg.exe dibuja en SVG, PDF y EPS, y encuentra su biblioteca"

      # La salida de Windows debe ser IDÉNTICA BYTE A BYTE a la de Linux. Se midió
      # a mano el 2026-07-27 —72 de 72— y por eso existe este paso: una medición
      # que nadie vuelve a hacer se pudre. La última diferencia que hubo fue el
      # cos(90°) del PDF, que imprimía un dígito distinto según la libm de cada
      # plataforma; se cerró redondeando el cero (PDFDisplay::deviceRotate).
      - name: La salida de Windows == la de Linux, byte a byte
        shell: bash
        run: |
          set -e
          mkdir -p salidas
          cd examples
          for f in *.mg; do
            n="${f%.mg}"
            for fmt in eps svg pdf; do
              ../metagrafica-windows-x86_64/mg.exe "$f" "../salidas/$n.$fmt" >/dev/null
            done
          done
          cd ..
          dif=0; n=0
          for f in salidas/*; do
            n=$((n+1))
            b="$(basename "$f")"
            if ! cmp -s "$f" "salidas-linux/$b"; then
              dif=$((dif+1))
              # Una compuerta que falla sin decir por qué es una mala compuerta:
              # aquí se imprime la diferencia, que en estos formatos es un número
              # suelto y se lee de un vistazo. Los binarios (PDF) van por cmp -l.
              echo "::group::DIFIERE $b"
              case "$b" in
                *.pdf) cmp -l "$f" "salidas-linux/$b" | head -20 ;;
                *)     diff "salidas-linux/$b" "$f" | head -30 ;;
              esac
              echo "::endgroup::"
            fi
          done
          echo "comparados $n archivos, difieren $dif"
          test "$dif" -eq 0

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: salidas-windows-divergentes
          path: salidas

  # Espejo del anterior para macOS, y por la misma razón de fondo: el binario que
  # se publica tiene que haber DIBUJADO algo antes de publicarse. Aquí pesa más
  # todavía, porque nadie en el proyecto tiene un Mac desde hace dos años: este
  # trabajo es el único ojo que queda sobre esa plataforma.
  #
  # No se prueba `include` sin ruta: el rescate «biblioteca junto al ejecutable»
  # es código #ifdef _WIN32. En Unix la ruta la hornea -DMG_LIBDIR y sin
  # `make install` no hay biblioteca instalada que encontrar.
  smoke-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: salidas-linux
          path: salidas-linux
      - name: Dibujar, y exigir la MISMA salida que Linux
        run: |
          set -e
          tar xzf metagrafica-macos-arm64.tar.gz
          mkdir -p salidas
          cd examples
          for f in *.mg; do
            n="${f%.mg}"
            for fmt in eps svg pdf; do
              ../metagrafica-macos-arm64/mg "$f" "../salidas/$n.$fmt" >/dev/null
            done
          done
          cd ..
          dif=0; n=0
          for f in salidas/*; do
            n=$((n+1))
            b="$(basename "$f")"
            if ! cmp -s "$f" "salidas-linux/$b"; then
              dif=$((dif+1))
              # Una compuerta que falla sin decir por qué es una mala compuerta:
              # aquí se imprime la diferencia, que en estos formatos es un número
              # suelto y se lee de un vistazo. Los binarios (PDF) van por cmp -l.
              echo "::group::DIFIERE $b"
              case "$b" in
                *.pdf) cmp -l "$f" "salidas-linux/$b" | head -20 ;;
                *)     diff "salidas-linux/$b" "$f" | head -30 ;;
              esac
              echo "::endgroup::"
            fi
          done
          echo "comparados $n archivos, difieren $dif"
          test "$dif" -eq 0

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: salidas-macos-divergentes
          path: salidas

  publicar:
    needs: [build, smoke-windows, smoke-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with: { path: dist }

      # Las novedades de ESTA versión viven en el repo (`docs/notas_release.md`) y no
      # aquí, por una razón: este cuerpo es el mismo para todos los tags, así que lo
      # que escribiera de una versión concreta quedaría mintiendo en la siguiente. El
      # archivo, en cambio, viaja CON el tag — describe la versión que lo publica y no
      # puede describir otra. Si falta, la página sale solo con el texto genérico.
      - name: Armar el cuerpo de la página
        run: |
          set -e
          : > cuerpo.md
          if [ -f docs/notas_release.md ]; then
            # El encabezado y la nota de mantenimiento del archivo son para quien lo
            # edita, no para quien descarga: se publica lo que va DESPUÉS del marcador
            # (`tail -n +2` se come la línea del marcador). El marcador es explícito y
            # no una heurística sobre encabezados, que es justo lo que se rompería al
            # reescribir el archivo en el próximo release.
            sed -n '/^<!-- publicar -->$/,$p' docs/notas_release.md | tail -n +2 >> cuerpo.md
            printf '\n---\n\n' >> cuerpo.md
          fi
          cat >> cuerpo.md <<'FIN'
          **MetaGráfica RELEASE_TAG**

          Beta se refiere a los **nombres**, no a la salida. El lenguaje crece
          añadiendo, y lo que la etiqueta reserva es poder renombrar algo antes
          del 1.0; los nombres viejos fallan de forma **ruidosa, nunca en
          silencio**.

          La salida sí es estable, y está medida: cada cambio pasa por una red
          de regresión sobre el corpus completo, y los mismos **93 archivos
          salen idénticos byte a byte en Linux, Windows y macOS**.

          Si escribes figuras con ella ahora, tu opinión sobre los nombres y la
          ergonomía es exactamente lo que falta para congelar la gramática.

          | archivo | para |
          |---|---|
          | `metagrafica-windows-x86_64.zip` | Windows — descomprime y corre `mg.exe`, sin instalar nada |
          | `metagrafica-linux-x86_64.tar.gz` | Linux |
          | `metagrafica-macos-arm64.tar.gz` | macOS (Apple Silicon) |

          Cada paquete lleva el binario, `lib/` (la biblioteca de `include`,
          que debe quedar junto al binario), los ejemplos y la referencia.

              mg figura.mg            → figura.eps
              mg figura.mg fig.svg    → SVG
              mg figura.mg fig.pdf    → PDF
          FIN
          sed -i "s/RELEASE_TAG/${GITHUB_REF_NAME}/" cuerpo.md

      - uses: softprops/action-gh-release@v3
        with:
          # Solo los PAQUETES. `dist/**/*` subiría también el artefacto
          # `salidas-linux` —93 archivos de referencia de la comparación entre
          # plataformas— a la página de descarga, que no es para eso.
          files: |
            dist/**/metagrafica-*.tar.gz
            dist/**/metagrafica-*.zip
          generate_release_notes: true
          body_path: cuerpo.md
